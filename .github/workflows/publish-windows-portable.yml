name: Publier le paquet Windows vérifié

on:
  workflow_dispatch:
    inputs:
      run_id:
        type: string
        required: true
        description: Identifiant de la recette Windows complète avec modèles
      export:
        type: boolean
        default: false
        description: Exporter les fichiers vérifiés pour une publication avec un compte autorisé

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NSI_RUN_ID: ${{ inputs.run_id }}
    steps:
      - name: Confirmer la réussite native
        id: verdict
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          run_id = os.environ["NSI_RUN_ID"]
          if not re.fullmatch(r"\d+", run_id):
              raise SystemExit("Identifiant de recette invalide.")
          result = json.loads(subprocess.check_output(["gh", "run", "view", run_id, "--json",
              "conclusion,workflowName,headSha,url"], text=True))
          if result["conclusion"] != "success" or result["workflowName"] != "Recette Windows portable":
              raise SystemExit("La recette Windows est absente ou incomplète.")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as entry:
              print("commit=" + result["headSha"], file=entry)
          PY
      - uses: actions/download-artifact@v4
        with:
          name: recette-windows-portable
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: native
      - name: Vérifier le ZIP issu de Windows et assembler ses preuves
        id: package
        env:
          NSI_COMMIT: ${{ steps.verdict.outputs.commit }}
          NSI_EXPORT: ${{ inputs.export }}
        run: |
          python - <<'PY'
          import json, os, re, zipfile
          from pathlib import Path
          package, = Path("native/paquet").glob("LANG-JEPA-NSI-*-Windows-x64.zip")
          with zipfile.ZipFile(package) as zipped:
              manifest = json.loads(zipped.read("LANG-JEPA-NSI-Windows/application/distribution/build.json"))
          version = manifest["version"]
          assert re.fullmatch(r"\d+\.\d+\.\d+", version) and manifest["commit"] == os.environ["NSI_COMMIT"], manifest
          assert package.name == f"LANG-JEPA-NSI-{version}-Windows-x64.zip"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as entry:
              print("version=" + version, file=entry)
          stats = json.loads(Path("native/windows-mesures/mesures.json").read_text(encoding="utf-8"))
          assert stats["platform"].startswith("Windows")
          release = tuple(map(int, version.split(".")))
          assert stats["active_after_stop"] == 0
          assert stats["engines"]["checks"]["inference"] and stats["engines"]["jepa"]["checks"]["selection"]
          if release >= (0, 7, 1):
              assert stats["dialogue"]["turns"] == 28 and stats["p71_turns"] == 14
          else:
              assert stats["dialogue"]["turns"] == 30
          if release >= (0, 7, 0):
              assert stats["p7_turns"] == 14
          for filename in ("windows-mesures/mesures.json", "windows-captures/ecarts.json",
                           "installe/LANG-JEPA-NSI-Windows/logs/prepare.json"):
              evidence = Path("native") / filename
              print(filename, json.dumps(json.loads(evidence.read_text(encoding="utf-8")), ensure_ascii=False))
          with zipfile.ZipFile(f"LANG-JEPA-NSI-{version}-Preuves-Windows.zip", "w", zipfile.ZIP_DEFLATED) as proof:
              compact = os.environ["NSI_EXPORT"] == "true"
              for directory in ("windows-captures", "windows-mesures", "installe"):
                  for file in sorted((Path("native") / directory).rglob("*")):
                      if file.is_file() and (not compact or directory != "windows-captures" or file.suffix == ".json"):
                          proof.write(file, file.relative_to("native").as_posix())
          PY
          (cd native/paquet && sha256sum --check SHA256SUMS.txt)
      - name: Exporter le ZIP testé et ses preuves
        if: inputs.export
        env:
          NSI_VERSION: ${{ steps.package.outputs.version }}
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import os
          from pathlib import Path
          version = os.environ["NSI_VERSION"]
          assets = [Path(f"native/paquet/LANG-JEPA-NSI-{version}-Windows-x64.zip"),
                    Path(f"LANG-JEPA-NSI-{version}-Preuves-Windows.zip")]
          for asset in assets:
              digest = hashlib.sha256(asset.read_bytes()).hexdigest()
              print(f"NSI_ASSET {asset.name} {asset.stat().st_size} {digest}")
              with asset.open("rb") as stream:
                  for index, chunk in enumerate(iter(lambda: stream.read(7200), b"")):
                      print(f"NSI_CHUNK {asset.name} {index} {base64.b64encode(chunk).decode('ascii')}")
          PY
      - name: Publier la distribution et ses preuves
        if: '!inputs.export'
        env:
          NSI_COMMIT: ${{ steps.verdict.outputs.commit }}
          NSI_VERSION: ${{ steps.package.outputs.version }}
        run: |
          cat > release-notes.md <<EOF_NOTES
          ZIP portable Windows x64 avec CPython et NumPy embarqués. Extraire le dossier, lancer Installer-Modeles.cmd avec Internet puis Demarrer.cmd. Arreter.cmd ferme l'instance. Le guide et les checksums accompagnent le paquet.

          L'archive a été construite et exécutée sur un runner Windows natif. Les deux moteurs ont répondu pendant les 30 tours de recette. Le ZIP de preuves contient les mesures, les traces synthétiques et les captures natives. Recette Windows 10/11 sur un poste cible de 16 Go à effectuer.

          Recette automatisée : https://github.com/$GH_REPO/actions/runs/$NSI_RUN_ID
          EOF_NOTES
          gh release create "v$NSI_VERSION" "native/paquet/LANG-JEPA-NSI-$NSI_VERSION-Windows-x64.zip" native/paquet/SHA256SUMS.txt "LANG-JEPA-NSI-$NSI_VERSION-Preuves-Windows.zip" --target "$NSI_COMMIT" --title "LANG-JEPA NSI $NSI_VERSION · Windows x64" --notes-file release-notes.md --prerelease
